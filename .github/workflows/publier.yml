# À chaque push sur main : on relance tous les tests, puis on publie le site sur GitHub Pages.
# Le site n'est publié que si les tests passent. Seul dist/index.html (le fichier unique
# autonome, construit par npm run build) est publié.
name: Vérifier puis publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Tests (check + e2e)
    runs-on: ubuntu-latest
    env:
      # Les hooks git ne servent qu'en local
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Installer les outils
        run: npm ci
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Lint, format, HTML et tests unitaires
        run: npm run check
      - name: Construction et tests de bout en bout
        run: npm run test:e2e
      - name: Garder le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  publier:
    name: Publication sur GitHub Pages
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Installer les outils
        run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      - name: Construire le fichier unique
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
